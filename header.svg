<svg fill="none" viewBox="0 0 800 220" width="100%" height="220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 背景: 深い北欧の夜空 -->
    <linearGradient id="nightSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#040814"/>
      <stop offset="50%" stop-color="#071126"/>
      <stop offset="100%" stop-color="#0A1830"/>
    </linearGradient>

    <!-- オーロラ 1: エメラルドグリーン -->
    <linearGradient id="auroraEmerald" x1="0%" y1="0%" x2="100%" y2="30%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0"/>
      <stop offset="25%" stop-color="#34D399" stop-opacity="0.75"/>
      <stop offset="55%" stop-color="#059669" stop-opacity="0.85"/>
      <stop offset="85%" stop-color="#10B981" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#059669" stop-opacity="0"/>
    </linearGradient>

    <!-- オーロラ 2: ティール & シアン -->
    <linearGradient id="auroraCyan" x1="0%" y1="50%" x2="100%" y2="0%">
      <stop offset="5%" stop-color="#06B6D4" stop-opacity="0"/>
      <stop offset="35%" stop-color="#22D3EE" stop-opacity="0.7"/>
      <stop offset="65%" stop-color="#0D9488" stop-opacity="0.8"/>
      <stop offset="95%" stop-color="#06B6D4" stop-opacity="0"/>
    </linearGradient>

    <!-- オーロラ 3: ほのかなバイオレット・マゼンタのカーテン -->
    <linearGradient id="auroraViolet" x1="0%" y1="20%" x2="100%" y2="60%">
      <stop offset="10%" stop-color="#8B5CF6" stop-opacity="0"/>
      <stop offset="45%" stop-color="#A855F7" stop-opacity="0.45"/>
      <stop offset="70%" stop-color="#6366F1" stop-opacity="0.35"/>
      <stop offset="95%" stop-color="#8B5CF6" stop-opacity="0"/>
    </linearGradient>

    <!-- ガウスぼかしフィルター（自然な光の拡散） -->
    <filter id="auroraGlowWide" x="-20%" y="-30%" width="140%" height="160%">
      <feGaussianBlur stdDeviation="28" result="blur"/>
    </filter>
    <filter id="auroraGlowSoft" x="-20%" y="-30%" width="140%" height="160%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
    </filter>

    <clipPath id="bannerClip">
      <rect width="800" height="220" rx="14"/>
    </clipPath>
  </defs>

  <style>
    .title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
      font-weight: 700;
      font-size: 32px;
      letter-spacing: 1.5px;
      fill: #FFFFFF;
    }
    .subtitle {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
      font-weight: 500;
      font-size: 14px;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      fill: #A7F3D0;
      opacity: 0.95;
    }
  </style>

  <g clip-path="url(#bannerClip)">
    <!-- 夜空のベース -->
    <rect width="800" height="220" fill="url(#nightSky)"/>

    <!-- 静寂な星空 -->
    <circle cx="85" cy="35" r="1.2" fill="#FFFFFF" opacity="0.5"/>
    <circle cx="160" cy="70" r="0.8" fill="#FFFFFF" opacity="0.3"/>
    <circle cx="240" cy="25" r="1.4" fill="#FFFFFF" opacity="0.6"/>
    <circle cx="340" cy="55" r="0.9" fill="#FFFFFF" opacity="0.4"/>
    <circle cx="470" cy="30" r="1.3" fill="#FFFFFF" opacity="0.7"/>
    <circle cx="560" cy="65" r="0.8" fill="#FFFFFF" opacity="0.35"/>
    <circle cx="670" cy="38" r="1.5" fill="#FFFFFF" opacity="0.55"/>
    <circle cx="740" cy="75" r="1.0" fill="#FFFFFF" opacity="0.4"/>

    <!-- オーロラの光のカーテン（有機的に重ねた光） -->
    <!-- 背面のバイオレット -->
    <path d="M-60,70 Q180,10 420,80 T860,40 L860,220 L-60,220 Z" fill="url(#auroraViolet)" filter="url(#auroraGlowWide)"/>
    
    <!-- メインのエメラルドグリーン光流 -->
    <path d="M-80,100 Q140,25 390,110 T880,55 L880,220 L-80,220 Z" fill="url(#auroraEmerald)" filter="url(#auroraGlowWide)"/>

    <!-- 手前の繊細なシアン・ティールの光彩 -->
    <path d="M-30,120 Q200,60 480,130 T840,85 L840,220 L-30,220 Z" fill="url(#auroraCyan)" filter="url(#auroraGlowSoft)"/>

    <!-- 水面や大気の微かな反射光 -->
    <ellipse cx="400" cy="215" rx="420" ry="45" fill="#059669" filter="url(#auroraGlowWide)" opacity="0.25"/>

    <!-- テキスト要素 -->
    <text x="50%" y="44%" dominant-baseline="middle" text-anchor="middle" class="title">
      Hi there, I'm Yuma 
    </text>
    <text x="50%" y="65%" dominant-baseline="middle" text-anchor="middle" class="subtitle">
      Web Developer · Frontend &amp; Backend
    </text>
  </g>
</svg>
