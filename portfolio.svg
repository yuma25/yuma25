<svg xmlns="http://www.w3.org/2000/svg" width="64" height="76" viewBox="0 0 64 76" fill="none">
  <defs>
    <!-- iOS風ダークアプリアイコンの微細なグラデーション -->
    <linearGradient id="iosBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2C2C2E"/>
      <stop offset="100%" stop-color="#1C1C1E"/>
    </linearGradient>

    <!-- アイコン枠線のハイライト（iOS特有の微かなエッジ） -->
    <linearGradient id="edgeHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.04"/>
    </linearGradient>
  </defs>

  <style>
    /* デフォルト（ライトモード / 白背景）: 見やすいダークグレー */
    .app-label {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: -0.1px;
      fill: #1F2328;
    }

    /* ダークモード（黒背景）: 見やすいライトグレー / 白 */
    @media (prefers-color-scheme: dark) {
      .app-label {
        fill: #F0F6FC;
      }
    }
  </style>

  <!-- iOS Squircle アプリアイコン本体 (48x48) -->
  <g transform="translate(8, 4)">
    <!-- ベース背景 -->
    <rect width="48" height="48" rx="11" fill="url(#iosBg)"/>
    
    <!-- 微細な外枠ハイライト -->
    <rect width="48" height="48" rx="11" stroke="url(#edgeHighlight)" stroke-width="1"/>

    <!-- 地球儀アイコン (中央配置) -->
    <g transform="translate(12, 12)" stroke="#FFFFFF" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <circle cx="12" cy="12" r="10"/>
      <path d="M2 12h20"/>
      <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
    </g>
  </g>

  <!-- iOS アプリ名ラベル (テーマに合わせて自動で白/黒が切り替わる) -->
  <text x="32" y="68" text-anchor="middle" class="app-label">Portfolio</text>
</svg>
